# Lodeline state/log/runtime directories owned root:lodeline, group-readable (#10).
# Type Path             Mode UID  GID   Age Argument
d /var/lib/lodeline        0750 root lodeline -
d /var/log/lodeline        0750 root lodeline -
d /run/lodeline            0750 root lodeline -
# The sender's own state directory, so `lodeline-sender enroll` can give it the client key (#553).
d /var/lib/lodeline-sender 0750 lodeline lodeline -
