# A separate workspace: the root workspace and its CI, release and packages
# workflows do not build this app. See .github/workflows/manager.yml.
[workspace]
resolver = "3"

[package]
name = "lodeline-manager"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Lodeline contributors"]
repository = "https://github.com/Ju571nK/lodeline"
description = "Read-only web console for a lodeline-server fleet."
publish = false

[dependencies]
lodeline-fleet-api = { path = "../../crates/lodeline-fleet-api" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# rustls-tls-native-roots: the OS trust store, which Go uses. fleet/http.rs and auth/oidc.rs turn
# the built-in web roots off.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
# reqwest's TLS stack; config.rs parses the CA bundle with it.
rustls = { version = "0.23", default-features = false, features = ["std"] }
# Same as the root workspace: Cargo allows one libsqlite3-sys per graph, and
# lodeline-server will join this graph as a dev-dependency.
rusqlite = { version = "0.31", features = ["bundled"] }
bcrypt = "0.19"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# The OIDC state, nonce and PKCE verifier bytes; already in the graph through jsonwebtoken.
getrandom = "0.2"
subtle = "2.6"
sha2 = "0.10"
# go-jose's key set checks (auth/oidc/jwk.rs): certificates, curve points and SHA-1
# thumbprints. All four are already in the graph through lodeline-server, jsonwebtoken and
# rustls.
x509-parser = "0.18"
p256 = "0.13"
p384 = "0.13"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: correctly rounded float parsing, as Go's strconv, so claim times compare the
# same. raw_value: triage evidence snapshots keep the client's JSON text, as Go's RawMessage.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# axum::serve has no header read timeout and also speaks h2c; Go's server does neither.
hyper = { version = "1", features = ["server", "http1"] }
# client-proxy: the env proxy matcher reqwest uses, for the loopback exemption in fleet/http.rs.
hyper-util = { version = "0.1", features = ["tokio", "server-graceful", "service", "http1", "client-proxy"] }
# Go's `:port` listener is dual-stack; std and tokio cannot turn IPV6_V6ONLY off.
socket2 = "0.6"
# Puts the client address on each request (conn.rs).
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic"] }

[dev-dependencies]
# start_paused: the body read timeout test (src/api/auth/tests.rs).
tokio = { version = "1", features = ["test-util"] }
# The contract test runs the real server in process (src/fleet/tests.rs).
lodeline-server = { path = "../../crates/lodeline-server" }
# An mTLS stand-in server for the client certificate tests (src/fleet/http/tests.rs).
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"

