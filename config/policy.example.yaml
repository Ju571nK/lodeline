# Example user-override policy. Drop into /etc/lodeline/policy.yaml or
# %ProgramData%\Lodeline\policy.yaml. On a root Unix agent with no --policy, a signed
# policy applied to /var/lib/lodeline/applied/policy.yaml replaces this file's content
# while it exists.
version: 1
host_id_strategy: machine_id

# Optional: disable a built-in default or change its tier. Built-in ids differ per
# OS, and an id this OS does not have stops the agent at boot.
# overrides:
#   - id: shadow-ai-binaries-macos
#     tier: standard

# Optional: add custom watchlist entries.
# A path is matched as a glob against the file an event names, so a folder path such as
# "~/.config/example/" matches the folder itself and never a file in it. To watch the files in a
# folder, write "~/.config/example/*" (`*` also crosses folder separators; `**` is rejected). This holds for
# every pattern you write; only the built-in skills and scheduled tasks entries name one folder.
targets:
  - id: team-mcp-allowlist
    description: Example MCP allowlist file
    tier: critical
    platform: any
    paths:
      - "~/.config/example/mcp-allowlist.json"
    recursive: false
    follow_symlinks: false

# Optional (Phase 3b): tune the AI Guard risk rubric. Keys are rubric kind_key
# values — run `lodeline doctor` to see the full effective table with current
# weights. Unknown keys are logged and ignored; an absent section = built-in
# defaults. Higher weight ⇒ that finding contributes more to a host's risk score.
rubric_overrides:
  # An unscanned external hook script is higher risk in our environment
  # (built-in default is 1.5):
  external_script_unscanned: 2.5
  # De-emphasize a broad, non-PreToolUse matcher (built-in default 0.5):
  broad_matcher_other: 0.25
