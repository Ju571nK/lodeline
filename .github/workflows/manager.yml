name: Manager

# apps/manager is its own Cargo workspace, which ci.yml ignores. It also runs
# when the shared fleet API types, lodeline-server, or any crate the server
# depends on by path changes, so a shape change breaks the manager build in the
# same PR.
on:
  push:
    branches: [main]
    paths:
      - 'apps/manager/**'
      - 'crates/lodeline-fleet-api/**'
      - 'crates/lodeline-server/**'
      - 'crates/lodeline-core/**'
      - 'crates/lodeline-proxy-api/**'
      - 'crates/lodeline-rules-basic/**'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/manager.yml'
  pull_request:
    paths:
      - 'apps/manager/**'
      - 'crates/lodeline-fleet-api/**'
      - 'crates/lodeline-server/**'
      - 'crates/lodeline-core/**'
      - 'crates/lodeline-proxy-api/**'
      - 'crates/lodeline-rules-basic/**'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/manager.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: apps/manager

jobs:
  rust:
    name: rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/manager -> target
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: check (MSRV)
        run: cargo +1.88 check --all-targets --locked

  # A `[::]` socket is IPv6-only by default on Windows, so `:port` must turn that off itself.
  windows:
    name: windows listener
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/manager -> target
      - name: listener and connection tests
        run: cargo test 'conn::'

  web:
    name: web
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/manager/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/manager/web/package-lock.json
      - run: npm ci
      - name: biome
        run: npm run lint
      - name: vitest
        run: npm test -- --run
      - name: vite build
        run: npm run build

  # The merge gate for the console as it ships: the release binary with the SPA embedded, driven
  # by the Playwright e2e specs and the parity table.
  e2e:
    name: e2e and parity
    runs-on: ubuntu-22.04
    env:
      MANAGER_BIN: ${{ github.workspace }}/apps/manager/target/release/lodeline-manager
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/manager -> target
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/manager/web/package-lock.json
      - name: npm ci
        working-directory: apps/manager/web
        run: npm ci
      - name: install Chromium
        working-directory: apps/manager/web
        run: npx playwright install --with-deps chromium
      - name: build SPA
        working-directory: apps/manager/web
        run: npm run build
      - name: build release binary
        env:
          LODELINE_MANAGER_REQUIRE_DIST: '1'
        run: cargo build --release --locked
      - name: playwright e2e
        working-directory: apps/manager/web
        env:
          E2E_TRIAGE_DB_PATH: ${{ runner.temp }}/e2e-triage.sqlite
        run: npm run e2e
      - name: parity
        if: ${{ !cancelled() }}
        working-directory: apps/manager/web
        run: npm run parity
      - name: upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: manager-playwright
          path: |
            apps/manager/web/playwright-report/
            apps/manager/web/test-results/
          retention-days: 14
