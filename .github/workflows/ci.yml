name: CI

on:
  push:
    branches: [main]
    paths:
      # Order matters: a later pattern overrides an earlier one. Docs and markdown
      # are skipped, but the proxy contract JSON that
      # crates/lodeline-proxy-api/tests/contract.rs include_str!s must still run CI,
      # and so must the signed-policy skill, whose SKILL.md holds the sync commit.
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!apps/**'
      - '!.github/workflows/manager.yml'
      - 'docs/specs/lodeline-proxy/contracts/**'
      - '.claude/skills/signed-policy/**'
  pull_request:
    paths:
      # Order matters: a later pattern overrides an earlier one. Docs and markdown
      # are skipped, but the proxy contract JSON that
      # crates/lodeline-proxy-api/tests/contract.rs include_str!s must still run CI,
      # and so must the signed-policy skill, whose SKILL.md holds the sync commit.
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!apps/**'
      - '!.github/workflows/manager.yml'
      - 'docs/specs/lodeline-proxy/contracts/**'
      - '.claude/skills/signed-policy/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: release manifest regressions
        run: python3 -m unittest discover -s tests -p test_release_manifest.py -v
      - name: migration regressions
        run: python3 -m unittest discover -s tests -p test_migrate_from_sigil.py -v
      - name: packaged unit regressions
        run: python3 -m unittest discover -s tests -p test_systemd_units.py -v
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # test-support is enabled by dev-dependencies, so clippy and cargo test never
      # compile the production feature set.
      - name: check (without dev-dependency features)
        run: cargo check --workspace
      - name: test (workspace)
        run: cargo test --workspace
      - name: release build
        if: github.event_name == 'push'
        run: cargo build --release --workspace
      - name: hardened build (lodeline-agent, --no-default-features)
        run: cargo build -p lodeline-agent --no-default-features

  # The proxy wire schemas and the Rust DTOs in lodeline-proxy-api can drift apart.
  contract-schema:
    name: proxy contract schemas
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r docs/specs/lodeline-proxy/contracts/requirements-check.txt
      - run: python docs/specs/lodeline-proxy/contracts/check_schema.py

  # The TLA+ model of the signed policy apply path, its drift check against the
  # covered Rust functions, and its mutants. No path filter: an edit to any
  # covered file can drift the model. The drift check reads the sync commit.
  signed-policy-model:
    name: signed-policy model check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: TLC pin
        id: tlc
        run: |
          grep -E '^TLC_(VERSION|SHA256) = ' .claude/skills/signed-policy/check.py | tr -d '" ' | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xdg-cache/lodeline-formal
          key: tlc-${{ steps.tlc.outputs.tlc_version }}-${{ steps.tlc.outputs.tlc_sha256 }}
      - name: model check
        run: python3 .claude/skills/signed-policy/check.py

  # Keeps `rust-version` in Cargo.toml honest (#240). rust-toolchain.toml pins
  # `stable`, so the MSRV toolchain is selected explicitly with `cargo +<ver>`.
  msrv:
    name: msrv / 1.88
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: check (MSRV)
        run: cargo +1.88 check --workspace --all-targets --locked

  # RHEL-family validation. GitHub has no hosted Rocky runner, so run inside
  # the rockylinux:9 container — this exercises the RHEL build path (glibc
  # 2.34, dnf-installed toolchain) that the ubuntu-22.04 leg above does not.
  # The .rpm build and install test live in packages.yml.
  rocky9:
    name: rockylinux:9 / stable
    runs-on: ubuntu-latest
    container: rockylinux:9
    env:
      # A cold-cache debug build fills the runner's disk ("No space left on device").
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: install build deps
        run: dnf -y install git gcc perl
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rocky9
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (workspace)
        run: cargo test --workspace
      # This container runs as root, the one place CI can show that enroll gives a file
      # to the owner of its directory and refuses a link planted there.
      - name: test (root-only ownership)
        run: |
          cargo test -p lodeline-sender --lib enroll::write -- --ignored
          cargo test -p lodeline-server --test enroll_token_cli -- --ignored
      - name: release build
        if: github.event_name == 'push'
        run: cargo build --release --workspace
      - name: hardened build (lodeline-agent, --no-default-features)
        run: cargo build -p lodeline-agent --no-default-features
