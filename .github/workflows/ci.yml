name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: release manifest regressions
        run: python3 -m unittest discover -s tests -p test_release_manifest.py -v
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: test (workspace)
        run: cargo test --workspace
      - name: release build
        run: cargo build --release --workspace
      - name: hardened build (lodeline-agent, --no-default-features)
        run: cargo build -p lodeline-agent --no-default-features

  # Keeps `rust-version` in Cargo.toml honest (#240). rust-toolchain.toml pins
  # `stable`, so the MSRV toolchain is selected explicitly with `cargo +<ver>`.
  msrv:
    name: msrv / 1.88
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: check (MSRV)
        run: cargo +1.88 check --workspace --all-targets --locked

  # RHEL-family validation. GitHub has no hosted Rocky runner, so run inside
  # the rockylinux:9 container — this exercises the RHEL build path (glibc
  # 2.34, dnf-installed toolchain) that the ubuntu-22.04 leg above does not.
  rocky9:
    name: rockylinux:9 / stable
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: install build deps
        # rpm-build provides /usr/lib/rpm/find-requires for packaging/build.sh (#234).
        run: dnf -y install git gcc perl rpm-build
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rocky9
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: test (workspace)
        run: cargo test --workspace
      - name: release build
        run: cargo build --release --workspace
      - name: hardened build (lodeline-agent, --no-default-features)
        run: cargo build -p lodeline-agent --no-default-features
      - name: build .rpm
        run: |
          cargo install cargo-generate-rpm --locked
          packaging/build.sh rpm
      - name: inspect & install-test .rpm (all 5 packages)
        run: |
          set -eux

          # AC-14 checks shared with the deb leg. systemd is not running in the
          # container, so assert on the missing wants symlink as well as
          # `systemctl is-enabled`, and scan /proc for a process or a listener.
          proxy_assert_disabled_and_silent() {
            if command -v systemctl >/dev/null 2>&1; then
              st=$(systemctl is-enabled lodeline-proxy 2>&1 || true)
              echo "systemctl is-enabled lodeline-proxy: $st"
              case "$st" in enabled*) echo "::error::lodeline-proxy is enabled"; exit 1 ;; esac
            fi
            if ls /etc/systemd/system/*.wants/lodeline-proxy.service >/dev/null 2>&1; then
              echo "::error::lodeline-proxy has a wants symlink (enabled)"
              exit 1
            fi
            for c in /proc/[0-9]*/comm; do
              if [ "$(cat "$c" 2>/dev/null)" = lodeline-proxy ]; then
                echo "::error::lodeline-proxy process is running"
                exit 1
              fi
            done
            # `run` without --config must refuse to start (exit 2), never fall back
            # to a default path.
            rc=0
            /usr/bin/lodeline-proxy run >/dev/null 2>&1 || rc=$?
            if [ "$rc" != 2 ]; then
              echo "::error::lodeline-proxy run without --config exited $rc, expected 2"
              exit 1
            fi
            # The process and port scans are only a smoke test (the binary never
            # starts here; the real guarantee is the package-content checks).
            # No listener on the default port 8480 (0x2120), state LISTEN (0A).
            if awk '$4 == "0A" && $2 ~ /:2120$/ { found = 1 } END { exit !found }' /proc/net/tcp /proc/net/tcp6 2>/dev/null; then
              echo "::error::something listens on 8480 after install"
              exit 1
            fi
          }

          while IFS='|' read -r pkg bin unit example; do
            # Anchor on a digit after the dash so `lodeline-*.rpm` doesn't match
            # lodeline-sender / lodeline-server / lodeline-signer too (issue #7).
            rpm=$(echo target/generate-rpm/${pkg}-[0-9]*.rpm)
            echo "=== inspecting $rpm ==="
            rpm -qpi "$rpm"
            rpm -qpl "$rpm"
            rpm -qp --scripts "$rpm"
            # Weak glibc version references must not become requirements (#234).
            if rpm -qp --requires "$rpm" | grep -F '[WEAK]'; then
              echo "::error::$rpm has [WEAK] requirements that dnf cannot satisfy (#234)"
              exit 1
            fi
            rpm -qpl "$rpm" | grep -qx "/usr/bin/${bin}"
            if [ "$pkg" = lodeline-proxy ]; then
              # AC-14: installed disabled, no live config, no auto enable/start,
              # no SELinux module load from this package.
              if rpm -qpl "$rpm" | grep -qx '/etc/lodeline/proxy.yaml'; then
                echo "::error::lodeline-proxy must not ship a live /etc/lodeline/proxy.yaml"
                exit 1
              fi
              scripts=$(rpm -qp --scripts "$rpm")
              if grep -Eq 'systemctl([[:space:]]+-[^[:space:]]+)*[[:space:]]+(enable|start)([[:space:]]|$)' <<< "$scripts"; then
                echo "::error::lodeline-proxy scripts must not enable or start the service"
                exit 1
              fi
              if grep -Eq 'semodule' <<< "$scripts"; then
                echo "::error::lodeline-proxy scripts must not load an SELinux module"
                exit 1
              fi
            fi
            if [ -n "$unit" ]; then
              rpm -qpl "$rpm" | grep -qx "/usr/lib/systemd/system/${unit}"
            fi
            if [ -n "$example" ]; then
              rpm -qpl "$rpm" | grep -qx "$example"
            fi
            echo "=== installing $rpm ==="
            rpm -i "$rpm"
            "/usr/bin/${bin}" --help >/dev/null
            if [ "$pkg" = lodeline-proxy ]; then
              /usr/bin/lodeline-proxy --version
              /usr/bin/lodeline-proxy version
              proxy_assert_disabled_and_silent
            fi
            if [ -n "$unit" ]; then
              test -f "/usr/lib/systemd/system/${unit}"
            fi
            if [ -n "$example" ]; then
              test -f "$example"
            fi
            echo "=== removing $pkg ==="
            rpm -e "$pkg"
            test ! -e "/usr/bin/${bin}"
          done <<-'TABLE'
          	lodeline|lodeline|lodeline.service|/etc/lodeline/policy.yaml.example
          	lodeline-sender|lodeline-sender|lodeline-sender.service|/etc/lodeline/sender.yaml.example
          	lodeline-server|lodeline-server|lodeline-server.service|/etc/lodeline/server.yaml.example
          	lodeline-signer|lodeline-sign||
          	lodeline-proxy|lodeline-proxy|lodeline-proxy.service|/etc/lodeline/proxy.yaml.example
          	TABLE

          # Co-install (#252), matching the deb leg.
          all=(lodeline lodeline-sender lodeline-server lodeline-signer lodeline-proxy)
          rpms=()
          for pkg in "${all[@]}"; do rpms+=("$(echo target/generate-rpm/${pkg}-[0-9]*.rpm)"); done
          rpm -i "${rpms[@]}"
          for f in lodeline lodeline-sender lodeline-server lodeline-proxy; do
            test -f "/usr/lib/sysusers.d/${f}.conf"
          done
          rpm -e "${all[@]}"

  # Debian/Ubuntu validation of the .deb packages. The rocky9 leg covers the
  # RPM path; this covers .deb end-to-end: build all five, install each, smoke
  # `--help`, then purge and verify cleanup. (#11)
  debian12:
    name: debian:12 / .deb install-test
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: install build deps
        run: |
          apt-get update
          apt-get install -y git gcc perl ca-certificates curl init-system-helpers
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: debian12
      - name: build .deb (all 5 packages)
        run: |
          cargo install cargo-deb --locked
          packaging/build.sh deb
      - name: inspect & install-test .deb (all 5 packages)
        shell: bash
        run: |
          set -eux
          # AC-14 checks shared by the rpm and deb legs. systemd is not running in
          # the container, so assert on the missing wants symlink as well as
          # `systemctl is-enabled`, and scan /proc for a process or a listener.
          proxy_assert_disabled_and_silent() {
            if command -v systemctl >/dev/null 2>&1; then
              st=$(systemctl is-enabled lodeline-proxy 2>&1 || true)
              echo "systemctl is-enabled lodeline-proxy: $st"
              case "$st" in enabled*) echo "::error::lodeline-proxy is enabled"; exit 1 ;; esac
            fi
            if ls /etc/systemd/system/*.wants/lodeline-proxy.service >/dev/null 2>&1; then
              echo "::error::lodeline-proxy has a wants symlink (enabled)"
              exit 1
            fi
            for c in /proc/[0-9]*/comm; do
              if [ "$(cat "$c" 2>/dev/null)" = lodeline-proxy ]; then
                echo "::error::lodeline-proxy process is running"
                exit 1
              fi
            done
            # `run` without --config must refuse to start (exit 2), never fall back
            # to a default path.
            rc=0
            /usr/bin/lodeline-proxy run >/dev/null 2>&1 || rc=$?
            if [ "$rc" != 2 ]; then
              echo "::error::lodeline-proxy run without --config exited $rc, expected 2"
              exit 1
            fi
            # The process and port scans are only a smoke test (the binary never
            # starts here; the real guarantee is the package-content checks).
            # No listener on the default port 8480 (0x2120), state LISTEN (0A).
            if awk '$4 == "0A" && $2 ~ /:2120$/ { found = 1 } END { exit !found }' /proc/net/tcp /proc/net/tcp6 2>/dev/null; then
              echo "::error::something listens on 8480 after install"
              exit 1
            fi
          }

          for entry in \
            "lodeline|lodeline|lodeline.service|/etc/lodeline/policy.yaml.example" \
            "lodeline-sender|lodeline-sender|lodeline-sender.service|/etc/lodeline/sender.yaml.example" \
            "lodeline-server|lodeline-server|lodeline-server.service|/etc/lodeline/server.yaml.example" \
            "lodeline-signer|lodeline-sign||" \
            "lodeline-proxy|lodeline-proxy|lodeline-proxy.service|/etc/lodeline/proxy.yaml.example"; do
            IFS='|' read -r pkg bin unit example <<< "$entry"
            # the `_` after the name keeps lodeline_ from matching lodeline-sender_ etc.
            deb=$(echo target/debian/${pkg}_[0-9]*.deb)
            echo "=== $pkg :: $deb ==="
            dpkg --info "$deb"
            # Capture once; grep via here-string. A `dpkg --contents | grep -q`
            # pipe SIGPIPEs dpkg's tar subprocess (grep exits at first match),
            # which fails the step under bash's default `set -o pipefail`.
            contents=$(dpkg --contents "$deb")
            printf '%s\n' "$contents"
            grep -qE "/usr/bin/${bin}$" <<< "$contents"
            [ -z "$unit" ]    || grep -qE "/systemd/system/${unit}$" <<< "$contents"
            [ -z "$example" ] || grep -qE "${example}$" <<< "$contents"
            if [ "$pkg" = lodeline-proxy ]; then
              # AC-14: no live config shipped; maintainer scripts never enable or
              # start the unit (debhelper's guarded was-enabled upgrade path and
              # try-restart are the only systemd calls).
              if grep -qE '/etc/lodeline/proxy\.yaml$' <<< "$contents"; then
                echo "::error::lodeline-proxy must not ship a live /etc/lodeline/proxy.yaml"
                exit 1
              fi
              ctl=$(mktemp -d)
              dpkg-deb -e "$deb" "$ctl"
              scripts=$(cat "$ctl/postinst" "$ctl/prerm" "$ctl/postrm")
              if grep -Eq 'systemctl([[:space:]]+-[^[:space:]]+)*[[:space:]]+(enable|start)([[:space:]]|$)|deb-systemd-invoke[[:space:]]+(start|restart)([[:space:]]|$)' <<< "$scripts"; then
                echo "::error::lodeline-proxy scripts must not enable or start the service"
                exit 1
              fi
              if grep -Eq 'semodule' <<< "$scripts"; then
                echo "::error::lodeline-proxy scripts must not load an SELinux module"
                exit 1
              fi
            fi
            # Use apt so the test also verifies that declared package
            # dependencies resolve in a minimal Debian installation.
            apt-get install -y "./$deb"
            "/usr/bin/${bin}" --help >/dev/null
            [ -z "$example" ] || test -f "$example"
            if [ "$pkg" = lodeline-proxy ]; then
              /usr/bin/lodeline-proxy --version
              /usr/bin/lodeline-proxy version
              proxy_assert_disabled_and_silent
            fi
            dpkg -P "$pkg"
            test ! -e "/usr/bin/${bin}"
          done

          # Co-install (#252): dpkg refuses a package that owns a path another
          # installed package owns, which the one-at-a-time loop above never hits.
          all=(lodeline lodeline-sender lodeline-server lodeline-signer lodeline-proxy)
          debs=()
          for pkg in "${all[@]}"; do debs+=("./$(echo target/debian/${pkg}_[0-9]*.deb)"); done
          apt-get install -y "${debs[@]}"
          for f in lodeline lodeline-sender lodeline-server lodeline-proxy; do
            test -f "/usr/lib/sysusers.d/${f}.conf"
          done
          # The per-package copies must stay identical (they define one shared
          # `lodeline` user and its directories).
          cmp /usr/lib/sysusers.d/lodeline.conf /usr/lib/sysusers.d/lodeline-sender.conf
          cmp /usr/lib/sysusers.d/lodeline.conf /usr/lib/sysusers.d/lodeline-server.conf
          cmp /usr/lib/tmpfiles.d/lodeline.conf /usr/lib/tmpfiles.d/lodeline-sender.conf
          dpkg -P "${all[@]}"
