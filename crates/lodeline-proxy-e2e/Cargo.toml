[package]
name = "lodeline-proxy-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Test-only: runs the real lodeline-server proxy control plane and the real lodeline-proxy together (#267)."
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
lodeline-server = { path = "../lodeline-server", features = ["test-support"] }
lodeline-proxy = { path = "../lodeline-proxy", features = ["test-util"] }
lodeline-proxy-api = { path = "../lodeline-proxy-api" }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls"] }
blake3 = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
